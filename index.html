<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habit & Wellness Tracker</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Habits">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3209/3209265.png">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-light: #EEF2FF;
            --success: #10B981;
            --success-light: #ECFDF5;
            --warning: #F59E0B;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px 14px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* เมนูแท็บสลับหน้า */
        .tab-bar {
            display: flex;
            background: #E2E8F0;
            border-radius: 14px;
            padding: 4px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            text-align: center;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 2px;
        }

        /* ส่วนเลือกวันที่ */
        .date-picker-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--primary-light);
            padding: 10px 14px;
            border-radius: 12px;
        }

        .date-picker-box label {
            font-weight: 500;
            color: var(--primary);
            font-size: 0.9rem;
        }

        .date-picker-box input {
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary);
            outline: none;
            cursor: pointer;
        }

        /* Progress Card */
        .progress-box {
            background: #F1F5F9;
            border-radius: 14px;
            padding: 14px 16px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #CBD5E1;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        /* รายการ Habit Card */
        .habit-card {
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .habit-card.passed {
            border-color: var(--success);
            background-color: var(--success-light);
        }

        .habit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .habit-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .habit-icon {
            font-size: 1.4rem;
        }

        .habit-title-box {
            display: flex;
            flex-direction: column;
        }

        .habit-title {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .habit-target-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .custom-checkbox {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid #CBD5E1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .habit-card.passed .custom-checkbox {
            background: var(--success);
            border-color: var(--success);
            color: white;
            font-size: 13px;
        }

        .habit-card.passed .custom-checkbox::after {
            content: '✔';
        }

        /* Input ภายใน Habit */
        .habit-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            padding: 6px 10px;
            border: 1px solid var(--border);
        }

        .habit-input-row span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .habit-input-row input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            text-align: right;
        }

        .habit-input-row .unit {
            font-size: 0.8rem;
            color: var(--text-muted);
            min-width: 40px;
        }

        /* ช่องความรู้สึกวันนี้ */
        .mood-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 6px;
        }

        .mood-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
        }

        .mood-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
            background: #F1F5F9;
            border-radius: 12px;
            padding: 8px 2px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 0;
        }

        .mood-btn .mood-emoji {
            font-size: 1.4rem;
            line-height: 1.2;
        }

        .mood-btn .mood-text {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
        }

        .mood-btn.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: scale(1.05);
        }

        .mood-btn.selected .mood-text {
            color: var(--primary);
            font-weight: 500;
        }

        .note-textarea {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            font-size: 0.9rem;
            outline: none;
            resize: vertical;
            min-height: 70px;
        }

        .note-textarea:focus {
            border-color: var(--primary);
        }

        /* แดชบอร์ดสรุปรายเดือน */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
            margin: 4px 0;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #F8FAFC;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 0.88rem;
        }

        .history-date {
            font-weight: 500;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบสลับหน้า -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tab-daily-btn">📝 บันทึกรายวัน</button>
            <button class="tab-btn" id="tab-monthly-btn">📊 แดชบอร์ดสรุปผล</button>
        </div>

        <!-- หน้าที่ 1: บันทึกรายวัน -->
        <div id="page-daily" class="card">
            <header>
                <h1>Daily Habit Tracker</h1>
                <p>บันทึกผลตามจริงเพื่อสร้างวินัยที่ดี</p>
            </header>

            <div class="date-picker-box">
                <label for="date-picker">📅 วันที่บันทึก:</label>
                <input type="date" id="date-picker">
            </div>

            <!-- สรุปความสำเร็จวันนี้ -->
            <div class="progress-box">
                <div class="progress-header">
                    <span>เป้าหมายสำเร็จวันนี้</span>
                    <span id="daily-progress-text">0/7 (0%)</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="daily-progress-fill"></div>
                </div>
            </div>

            <!-- รายการเป้าหมาย 7 ข้อ -->
            <div id="habit-container" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- Habit รายการจะถูกแทรกที่นี่ -->
            </div>

            <!-- ช่องความรู้สึกวันนี้ -->
            <div class="mood-section">
                <label style="font-weight: 500; font-size: 0.95rem;">💭 วันนี้รู้สึกอย่างไรบ้าง?</label>
                <div class="mood-selector">
                    <button class="mood-btn" data-mood="😆">
                        <span class="mood-emoji">😆</span>
                        <span class="mood-text">ดีมาก</span>
                    </button>
                    <button class="mood-btn" data-mood="🙂">
                        <span class="mood-emoji">🙂</span>
                        <span class="mood-text">โอเค</span>
                    </button>
                    <button class="mood-btn" data-mood="😴">
                        <span class="mood-emoji">😴</span>
                        <span class="mood-text">เพลีย</span>
                    </button>
                    <button class="mood-btn" data-mood="😫">
                        <span class="mood-emoji">😫</span>
                        <span class="mood-text">เครียด</span>
                    </button>
                    <button class="mood-btn" data-mood="🤒">
                        <span class="mood-emoji">🤒</span>
                        <span class="mood-text">ไม่สบาย</span>
                    </button>
                </div>
                <textarea id="daily-note" class="note-textarea" placeholder="บันทึกความรู้สึก หรือเรื่องราวสั้นๆ ของวันนี้..."></textarea>
            </div>
        </div>

        <!-- หน้าที่ 2: แดชบอร์ดสรุปผล -->
        <div id="page-monthly" class="card hidden">
            <header>
                <h1>Monthly Dashboard</h1>
                <p>สถิติภาพรวมประจำเดือน</p>
            </header>

            <div class="date-picker-box">
                <label for="month-picker">📅 เลือกเดือน:</label>
                <input type="month" id="month-picker">
            </div>

            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-label">เป้าหมายสำเร็จเฉลี่ย</div>
                    <div class="stat-value" id="stat-avg-goal">0%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">บันทึกไปแล้ว</div>
                    <div class="stat-value" id="stat-logged-days">0 วัน</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">เวลานอนเฉลี่ย</div>
                    <div class="stat-value" id="stat-avg-sleep">0 ชม.</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">ดื่มน้ำเฉลี่ย</div>
                    <div class="stat-value" id="stat-avg-water">0 ลิตร</div>
                </div>
                <div class="stat-box" style="grid-column: span 2;">
                    <div class="stat-label">แคลอรีเฉลี่ยต่อวัน</div>
                    <div class="stat-value" id="stat-avg-calories">0 kcal</div>
                </div>
            </div>

            <h3 style="font-size: 1rem; font-weight: 500; margin-top: 4px;">ประวัติรายวันในเดือนนี้</h3>
            <div class="history-list" id="history-list">
                <!-- ข้อมูลรายวันจะแสดงที่นี่ -->
            </div>
        </div>
    </div>

    <script>
        // โครงสร้างนิสัย 7 อย่าง พร้อมเงื่อนไขตรวจสอบเป้าหมาย
        const HABIT_CONFIGS = [
            {
                id: 'sleep_hours',
                title: 'นอนครบ 8 ชั่วโมง',
                icon: '😴',
                type: 'number',
                placeholder: 'เช่น 7.5',
                unit: 'ชม.',
                hint: 'เป้าหมาย: ≥ 8 ชม.',
                checkPass: (val) => parseFloat(val) >= 8
            },
            {
                id: 'water',
                title: 'ดื่มน้ำ 2 ลิตร',
                icon: '💧',
                type: 'number',
                placeholder: 'เช่น 2.2',
                unit: 'ลิตร',
                hint: 'เป้าหมาย: ≥ 2 ลิตร',
                checkPass: (val) => parseFloat(val) >= 2
            },
            {
                id: 'workout',
                title: 'ออกกำลังกาย',
                icon: '🏃',
                type: 'number',
                placeholder: 'เช่น 30',
                unit: 'นาที',
                hint: 'เป้าหมาย: ≥ 20 นาที หรือติ๊กผ่าน',
                checkPass: (val) => parseFloat(val) >= 20
            },
            {
                id: 'protein',
                title: 'กินโปรตีน',
                icon: '🥩',
                type: 'number',
                placeholder: 'เช่น 60',
                unit: 'กรัม',
                hint: 'เป้าหมาย: กรอกปริมาณโปรตีน',
                checkPass: (val) => parseFloat(val) > 0
            },
            {
                id: 'calories',
                title: 'แคลอรีไม่เกิน 1500 kcal',
                icon: '🥗',
                type: 'number',
                placeholder: 'เช่น 1350',
                unit: 'kcal',
                hint: 'เป้าหมาย: ≤ 1500 kcal',
                checkPass: (val) => {
                    const num = parseFloat(val);
                    return !isNaN(num) && num > 0 && num <= 1500;
                }
            },
            {
                id: 'sleep_time',
                title: 'เข้านอนก่อน 22.00 น.',
                icon: '🌙',
                type: 'time',
                placeholder: '',
                unit: 'เวลา',
                hint: 'เป้าหมาย: ก่อนหรือตรง 22:00',
                checkPass: (val) => {
                    if (!val) return false;
                    const [h, m] = val.split(':').map(Number);
                    return (h >= 18 && h < 22) || (h === 22 && m === 0);
                }
            },
            {
                id: 'wake_time',
                title: 'ตื่น 05.00 น.',
                icon: '⏰',
                type: 'time',
                placeholder: '',
                unit: 'เวลา',
                hint: 'เป้าหมาย: ไม่เกิน 05:00 น.',
                checkPass: (val) => {
                    if (!val) return false;
                    const [h, m] = val.split(':').map(Number);
                    return (h >= 3 && h < 5) || (h === 5 && m === 0);
                }
            }
        ];

        // องค์ประกอบ DOM
        const datePicker = document.getElementById('date-picker');
        const monthPicker = document.getElementById('month-picker');
        const habitContainer = document.getElementById('habit-container');
        const dailyProgressText = document.getElementById('daily-progress-text');
        const dailyProgressFill = document.getElementById('daily-progress-fill');
        const dailyNote = document.getElementById('daily-note');
        const moodBtns = document.querySelectorAll('.mood-btn');

        const tabDailyBtn = document.getElementById('tab-daily-btn');
        const tabMonthlyBtn = document.getElementById('tab-monthly-btn');
        const pageDaily = document.getElementById('page-daily');
        const pageMonthly = document.getElementById('page-monthly');

        // ตั้งค่าวันปัจจุบัน (YYYY-MM-DD)
        const todayStr = new Date().toLocaleDateString('en-CA');
        datePicker.value = todayStr;
        monthPicker.value = todayStr.substring(0, 7);

        // LocalStorage Helpers
        function getDB() {
            return JSON.parse(localStorage.getItem('habit_tracker_db') || '{}');
        }

        function saveDB(db) {
            localStorage.setItem('habit_tracker_db', JSON.stringify(db));
        }

        function getDayData(dateStr) {
            const db = getDB();
            return db[dateStr] || { values: {}, manualChecks: {}, mood: '', note: '' };
        }

        function updateDayData(dateStr, partial) {
            const db = getDB();
            db[dateStr] = { ...getDayData(dateStr), ...partial };
            saveDB(db);
        }

        // แท็บสลับหน้า
        tabDailyBtn.addEventListener('click', () => {
            tabDailyBtn.classList.add('active');
            tabMonthlyBtn.classList.remove('active');
            pageDaily.classList.remove('hidden');
            pageMonthly.classList.add('hidden');
            renderDaily();
        });

        tabMonthlyBtn.addEventListener('click', () => {
            tabMonthlyBtn.classList.add('active');
            tabDailyBtn.classList.remove('active');
            pageMonthly.classList.remove('hidden');
            pageDaily.classList.add('hidden');
            renderMonthly();
        });

        // เรนเดอร์หน้ารายวัน
        function renderDaily() {
            const curDate = datePicker.value;
            const data = getDayData(curDate);
            habitContainer.innerHTML = '';

            let passCount = 0;

            HABIT_CONFIGS.forEach(cfg => {
                const val = data.values?.[cfg.id] || '';
                const manualCheck = !!data.manualChecks?.[cfg.id];
                const autoPass = cfg.checkPass(val);
                const isPassed = autoPass || manualCheck;

                if (isPassed) passCount++;

                const card = document.createElement('div');
                card.className = `habit-card ${isPassed ? 'passed' : ''}`;
                card.innerHTML = `
                    <div class="habit-header">
                        <div class="habit-info">
                            <span class="habit-icon">${cfg.icon}</span>
                            <div class="habit-title-box">
                                <span class="habit-title">${cfg.title}</span>
                                <span class="habit-target-hint">${cfg.hint}</span>
                            </div>
                        </div>
                        <div class="custom-checkbox" data-id="${cfg.id}"></div>
                    </div>
                    <div class="habit-input-row">
                        <span>บันทึกจริง:</span>
                        <input type="${cfg.type}" 
                               data-id="${cfg.id}" 
                               value="${val}" 
                               placeholder="${cfg.placeholder}">
                        <span class="unit">${cfg.unit}</span>
                    </div>
                `;

                // ติ๊ก Checkbox
                const chk = card.querySelector('.custom-checkbox');
                chk.addEventListener('click', () => {
                    const current = getDayData(curDate);
                    current.manualChecks = current.manualChecks || {};
                    current.manualChecks[cfg.id] = !current.manualChecks[cfg.id];
                    updateDayData(curDate, current);
                    renderDaily();
                });

                // กรอกข้อมูล Input
                const inp = card.querySelector('input');
                inp.addEventListener('input', (e) => {
                    const current = getDayData(curDate);
                    current.values = current.values || {};
                    current.values[cfg.id] = e.target.value;
                    updateDayData(curDate, current);
                    
                    const isNowPassed = cfg.checkPass(e.target.value) || !!current.manualChecks?.[cfg.id];
                    if (isNowPassed) card.classList.add('passed');
                    else card.classList.remove('passed');
                    updateDailyProgress();
                });

                habitContainer.appendChild(card);
            });

            updateDailyProgress();

            dailyNote.value = data.note || '';
            moodBtns.forEach(btn => {
                if (btn.dataset.mood === data.mood) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }

        function updateDailyProgress() {
            const curDate = datePicker.value;
            const data = getDayData(curDate);
            let passCount = 0;

            HABIT_CONFIGS.forEach(cfg => {
                const val = data.values?.[cfg.id] || '';
                const manual = !!data.manualChecks?.[cfg.id];
                if (cfg.checkPass(val) || manual) passCount++;
            });

            const percent = Math.round((passCount / HABIT_CONFIGS.length) * 100);
            dailyProgressFill.style.width = `${percent}%`;
            dailyProgressText.innerText = `${passCount}/${HABIT_CONFIGS.length} (${percent}%)`;
        }

        datePicker.addEventListener('change', renderDaily);

        moodBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const curDate = datePicker.value;
                const mood = btn.dataset.mood;
                const current = getDayData(curDate);
                current.mood = (current.mood === mood) ? '' : mood;
                updateDayData(curDate, current);
                renderDaily();
            });
        });

        dailyNote.addEventListener('input', (e) => {
            const curDate = datePicker.value;
            const current = getDayData(curDate);
            current.note = e.target.value;
            updateDayData(curDate, current);
        });

        // เรนเดอร์แดชบอร์ดรายเดือน
        function renderMonthly() {
            const selectedMonth = monthPicker.value;
            const db = getDB();
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';

            let totalDaysLogged = 0;
            let sumPercentages = 0;
            let totalSleep = 0;
            let sleepCount = 0;
            let totalWater = 0;
            let waterCount = 0;
            let totalCalories = 0;
            let calCount = 0;

            const datesInMonth = Object.keys(db)
                .filter(d => d.startsWith(selectedMonth))
                .sort((a, b) => b.localeCompare(a));

            datesInMonth.forEach(dateStr => {
                const day = db[dateStr];
                let passed = 0;

                HABIT_CONFIGS.forEach(cfg => {
                    const val = day.values?.[cfg.id];
                    const manual = day.manualChecks?.[cfg.id];
                    if (cfg.checkPass(val) || manual) passed++;
                });

                if (day.values?.sleep_hours) {
                    totalSleep += parseFloat(day.values.sleep_hours) || 0;
                    sleepCount++;
                }

                if (day.values?.water) {
                    totalWater += parseFloat(day.values.water) || 0;
                    waterCount++;
                }

                if (day.values?.calories) {
                    totalCalories += parseFloat(day.values.calories) || 0;
                    calCount++;
                }

                const dayPercent = Math.round((passed / HABIT_CONFIGS.length) * 100);
                sumPercentages += dayPercent;
                totalDaysLogged++;

                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span>${day.mood || '📝'}</span>
                        <div>
                            <span class="history-date">${dateStr}</span>
                            ${day.note ? `<div style="font-size:0.75rem; color:var(--text-muted);">${day.note.substring(0,25)}...</div>` : ''}
                        </div>
                    </div>
                    <span style="font-weight:600; color:${dayPercent >= 80 ? 'var(--success)' : 'var(--primary)'}">
                        ${passed}/${HABIT_CONFIGS.length} (${dayPercent}%)
                    </span>
                `;
                historyList.appendChild(item);
            });

            if (totalDaysLogged === 0) {
                historyList.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">ยังไม่มีข้อมูลของเดือนนี้</div>';
            }

            document.getElementById('stat-logged-days').innerText = `${totalDaysLogged} วัน`;
            document.getElementById('stat-avg-goal').innerText = totalDaysLogged > 0 
                ? `${Math.round(sumPercentages / totalDaysLogged)}%` 
                : '0%';
            document.getElementById('stat-avg-sleep').innerText = sleepCount > 0 
                ? `${(totalSleep / sleepCount).toFixed(1)} ชม.` 
                : '0 ชม.';
            document.getElementById('stat-avg-water').innerText = waterCount > 0 
                ? `${(totalWater / waterCount).toFixed(1)} ล.` 
                : '0 ลิตร';
            document.getElementById('stat-avg-calories').innerText = calCount > 0 
                ? `${Math.round(totalCalories / calCount)} kcal` 
                : '0 kcal';
        }

        monthPicker.addEventListener('change', renderMonthly);

        renderDaily();
    </script>
</body>
</html>
